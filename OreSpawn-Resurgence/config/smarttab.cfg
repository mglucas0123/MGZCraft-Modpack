# Configuration file

server {
    # Se true, ao entrar no servidor cada cliente recebe estas opcoes de TAB (secao tab) e aplica em memoria.
    B:"Push tab config to clients"=true
}


tab {
    # Quando true, o TAB adapta colunas/linhas conforme players online e tamanho da tela.
    B:"Auto layout by online"=true

    # Altura de cada card de jogador em pixels. [range: 12 ~ 40, default: 18]
    I:"Cell height"=18

    # Largura de cada card de jogador em pixels. [range: 60 ~ 320, default: 120]
    I:"Cell width"=120

    # Quando true, os jogadores sao ordenados por regras de cargo antes da ordem alfabetica.
    B:"Enable role ordering"=true

    # Quantidade de jogadores fake temporarios para testar layout e ordenacao no TAB. [range: 0 ~ 200, default: 0]
    I:"Fake players count"=0

    # Quantidade maxima de linhas renderizadas no TAB. [range: 1 ~ 40, default: 20]
    I:"Max rows"=20

    # Quantidade de cards de jogadores por linha. [range: 1 ~ 16, default: 5]
    I:"Players in a row"=5

    # Quando true, o TAB usa as cores e tags do displayname do plugin/servidor sem sobrescrever nome/emblema local.
    B:"Respect plugin name style"=true

    # Cada regra: priority;matchTokens;nameColor;backgroundColor;badge. matchTokens sao separados por virgula e podem incluir name:<nick> para correspondencia exata.
    S:"Role rules" <
        0;name:Owner,[OWNER],[DONO],perm.owner;&4;0x55330000;[O]
        10;[STAFF],[MOD],perm.staff,perm.mod;&c;0x55350000;[S]
        20;[VIP],perm.vip;&6;0x55443300;[V]
        90;[FAKE],perm.fake;&b;0x55203355;[F]
     >

    # Exibir texto de rodape abaixo da lista de jogadores.
    B:"Show tab footer"=true

    # Exibir texto de cabecalho acima da lista de jogadores.
    B:"Show tab header"=true

    # Tamanho da cabeca do jogador renderizada em pixels. [range: 8 ~ 32, default: 16]
    I:"Skin size"=16

    # Template de URL externa de skin.
    S:"Skins URL, %player% will be replaced with player's name"=https://tlauncher.org/upload/all/nickname/%player%.png

    # Texto do rodape exibido na parte inferior da lista TAB customizada.
    S:"Tab Footer, you can use such variables as %online%, %maxplayers%"=&6&lJogadores online: %online%&7&l/&6&l%maxplayers%

    # Texto do cabecalho no topo (ignorado se a logo do TAB estiver ligada — nesse caso mostra-se so a logo).
    S:"Tab Header, you can use such variables as %online%, %maxplayers%"=&6&lOreSpawn Resurgence

    # PNG banner centrado no topo do TAB (substitui o texto do cabecalho enquanto estiver definido). Por defeito: resource:smarttab:textures/gui/logo.png. HTTPS ou resource:... Vazio = desligado.
    S:"Tab footer logo URL or resource"=resource:smarttab:textures/gui/logo.png

    # Altura maxima na GUI (banners largos: ~96-140; maior = logo mais alta e nitida com PNG grande). [range: 8 ~ 200, default: 128]
    I:"Tab footer logo max height"=128

    # Largura maxima na GUI (banners: ~400-560). [range: 16 ~ 720, default: 520]
    I:"Tab footer logo max width"=520

    # Espaco vertical extra na faixa da logo no topo (maior = mais margem em volta da imagem). [range: 0 ~ 40, default: 5]
    I:"Tab footer logo top padding"=5
}


