# Configuration file

general {
    # Ativa ou desativa o modo de debug (true/false)
    B:debugMode=false

    # MGZ Core Mod
    S:greeting=MGZCore

    # Player MAC address
    S:macAddress=

    # Player name
    S:playerName=
}


login {
    # Ativa ou desativa a mensagem de login
    B:enabled=false

    # Linhas a serem exibidas na mensagem de login; use {player} para inserir o nick do jogador
    S:messageLines <
     >
}


store {
    # Distancia acumulada (em blocos) exigida junto da sequencia de movimento confiavel para retomar do AFK
    I:afkResumeHorizontalBlocks=3

    # Intervalo de envio dos eventos nativos do Passe a Central (segundos)
    I:battlePassReportIntervalSeconds=15

    # Porta HTTP da ponte de administracao MGZCore
    I:bridgePort=8080

    # URL base da MGZ Central (mesma do launcher)
    S:centralApiUrl=https://mgzcraft.duckdns.org

    # Ativa poll de comandos da loja (VIP etc.)
    B:commandsEnabled=true

    # Detecta movimento altamente periodico sustentado; nunca ativa AFK imediatamente
    B:detectAntiAfk=true

    # Registra quando movimento periodico deixa de renovar atividade
    B:logSuspiciousActivity=true

    # Intervalo de reporte de playtime à Central (segundos)
    I:playtimeReportIntervalSeconds=60

    # Intervalo entre polls da fila de comandos (segundos)
    I:pollIntervalSeconds=15

    # Identificador estavel desta instancia do servidor para o protocolo de comandos
    S:serverId=663c9693-456a-4fc7-8e4c-7c89c5aec542

    # Token MGZCORE_SERVER_TOKEN (mesmo valor no Coolify da Central)
    S:serverToken=mgz_srv_token_5c6b1096e4f9492026c8

    # Exibe mensagens de AFK no chat do jogador
    B:showAfkMessages=true
}


